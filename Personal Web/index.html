<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Web Personal Sederhana</title>
    <!-- Favicon -->
    <link rel="icon" href="https://via.placeholder.com/16" type="image/x-icon">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            color: #333333;
            margin: 20px;
        }
        header {
            text-align: center;
            background-color: #2c3e50;
            color: white;
            padding: 15px;
        }
        .profile-img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            margin-top: 10px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }
        table, th, td {
            border: 1px solid #cccccc;
            padding: 8px;
            text-align: left;
        }
        th {
            background-color: #e2e2e2;
        }
        footer {
            margin-top: 20px;
            text-align: center;
            font-size: 14px;
            color: #666;
        }
    </style>
</head>
<body>

    <header>
        <h1>Profil Saya</h1>
        <p>Halaman Web Statis Sederhana</p>
    </header>

    <div style="text-align: center;">
        <h3>Foto Profil</h3>
        <!-- Picture / Image -->
        <img src="Jefri.png.jpeg" alt="Foto Profil" class="profile-img">
        <p><a href="https://github.com/jefrifebriano18" target="_blank">Kunjungi GitHub Saya</a></p>
    </div>

    <h2>Informasi Biodata</h2>
    <!-- Table -->
    <table>
        <tr>x
            <th>Kategori</th>
            <th>Detail</th>
        </tr>
        <tr>
            <td>Nama Lengkap</td>
            <td>Jefri Febriano Gunawan</td>
        </tr>
        <tr>
            <td>Program Studi</td>
            <td>Sistem Informasi</td>
        </tr>
        <tr>
            <td>Keahlian</td>
            <td>HTML, CSS, PHP Dasar</td>
        </tr>
    </table>

    <footer>
        <!-- Date and Time -->
        <p>Halaman diakses pada: <time id="waktu"></time></p>
    </footer>

    <script>
        document.getElementById('waktu').innerText = new Date().toLocaleString('id-ID');
    </script>

</body>
</html>
